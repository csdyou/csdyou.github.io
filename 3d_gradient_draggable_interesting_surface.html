
<style>
  canvas { display: block; margin: 0 auto; }
  .ctrl { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 10px 0 4px; font-size: 13px; color: var(--color-text-secondary); }
  .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--color-text-secondary); padding: 6px 0 2px; }
  .ld { display: flex; align-items: center; gap: 5px; }
  .lc { width: 22px; height: 3px; border-radius: 2px; }
  #hint { font-size: 12px; color: var(--color-text-tertiary); text-align: center; padding-bottom: 4px; }
</style>

<canvas id="c" width="640" height="440"></canvas>
<div class="ctrl">
  <label><input type="checkbox" id="chkGrad" checked> 梯度 ∇f</label>
  <label><input type="checkbox" id="chkTan" checked> 切平面</label>
  <label><input type="checkbox" id="chkContour" checked> 等高線</label>
</div>
<div id="hint">左鍵拖曳粉色點　／　右鍵拖曳旋轉視角</div>
<div class="legend">
  <div class="ld"><div class="lc" style="background:#378ADD"></div>等高線</div>
  <div class="ld"><div class="lc" style="background:#E85D24"></div>梯度 ∇f（垂直等高線）</div>
  <div class="ld"><div class="lc" style="background:rgba(100,200,120,0.7);height:8px;width:22px;border-radius:2px"></div>切平面</div>
  <div class="ld"><div class="lc" style="background:#D4537E;width:10px;height:10px;border-radius:50%"></div>可拖曳的點 (a,b)</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx0 = W/2, cy0 = H/2 + 40;
const scale = 75;

let rotX = 0.52, rotY = 0.55;
let draggingView = false, draggingPoint = false;
let lastX = 0, lastY = 0;
let pt = { x: 0.8, y: 0.5 };

// Interesting surface: multiple peaks and valleys
// f(x,y) = sin(x)*cos(y) + 0.5*cos(2x - y) + 0.3*sin(x+2y)
function f(x, y) {
  return (
    Math.sin(x * 1.3) * Math.cos(y * 1.1) * 0.9 +
    0.55 * Math.cos(1.8*x - 0.9*y) +
    0.35 * Math.sin(0.9*x + 1.8*y) -
    0.12 * (x*x + y*y) * 0.15
  );
}

function grad2(x, y) {
  const h = 0.0005;
  return {
    gx: (f(x+h,y) - f(x-h,y)) / (2*h),
    gy: (f(x,y+h) - f(x,y-h)) / (2*h)
  };
}

function project(x, y, z) {
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const x1 = x*cosY + z*sinY;
  const z1 = -x*sinY + z*cosY;
  const y1 = y*cosX - z1*sinX;
  const z2 = y*sinX + z1*cosX;
  const fov = 5;
  const d = fov - z2*0.28;
  return { sx: cx0 + x1*scale*fov/d, sy: cy0 - y1*scale*fov/d, depth: z2 };
}

function screenDeltaToWorld(dsx, dsy) {
  const o = project(0,0,0);
  const wx = project(1,0,0), wy = project(0,1,0);
  const wxS = { x: wx.sx-o.sx, y: wx.sy-o.sy };
  const wyS = { x: wy.sx-o.sx, y: wy.sy-o.sy };
  const det = wxS.x*wyS.y - wxS.y*wyS.x;
  if (Math.abs(det) < 0.01) return { dx: 0, dy: 0 };
  const a = (dsx*wyS.y - dsy*wyS.x) / det;
  const b = (wxS.x*dsy - wxS.y*dsx) / det;
  return { dx: a, dy: b };
}

function hitPoint(mx, my, wx, wy, wz, r=16) {
  const p = project(wx, wy, wz);
  return Math.hypot(mx - p.sx, my - p.sy) < r;
}

function getXY(e) {
  const r = canvas.getBoundingClientRect();
  const sw = W/r.width, sh = H/r.height;
  if (e.touches) return { x:(e.touches[0].clientX-r.left)*sw, y:(e.touches[0].clientY-r.top)*sh };
  return { x:(e.clientX-r.left)*sw, y:(e.clientY-r.top)*sh };
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  const {x,y} = getXY(e);
  if (e.button === 2) { draggingView=true; lastX=e.clientX; lastY=e.clientY; return; }
  const az = f(pt.x, pt.y);
  if (hitPoint(x, y, pt.x, pt.y, az)) { draggingPoint=true; lastX=e.clientX; lastY=e.clientY; canvas.style.cursor='grabbing'; return; }
  draggingView=true; lastX=e.clientX; lastY=e.clientY;
});

canvas.addEventListener('mousemove', e => {
  const {x,y} = getXY(e);
  const scaleW = W / canvas.getBoundingClientRect().width;
  const scaleH = H / canvas.getBoundingClientRect().height;
  if (!draggingView && !draggingPoint) {
    canvas.style.cursor = hitPoint(x, y, pt.x, pt.y, f(pt.x,pt.y)) ? 'grab' : 'default';
    return;
  }
  const dsx = (e.clientX-lastX)*scaleW, dsy = (e.clientY-lastY)*scaleH;
  if (draggingView) {
    rotY += (e.clientX-lastX)*0.012;
    rotX = Math.max(-1.2, Math.min(1.2, rotX + (e.clientY-lastY)*0.012));
  } else {
    const {dx,dy} = screenDeltaToWorld(dsx, dsy);
    pt.x = Math.max(-2.3, Math.min(2.3, pt.x+dx));
    pt.y = Math.max(-2.3, Math.min(2.3, pt.y+dy));
  }
  lastX=e.clientX; lastY=e.clientY;
});

canvas.addEventListener('mouseup', () => { draggingView=false; draggingPoint=false; canvas.style.cursor='default'; });
canvas.addEventListener('mouseleave', () => { draggingView=false; draggingPoint=false; });

canvas.addEventListener('touchstart', e => {
  const {x,y}=getXY(e); const t0=e.touches[0];
  if (hitPoint(x,y,pt.x,pt.y,f(pt.x,pt.y),22)) { draggingPoint=true; lastX=t0.clientX; lastY=t0.clientY; e.preventDefault(); return; }
  draggingView=true; lastX=t0.clientX; lastY=t0.clientY; e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove', e => {
  const t0=e.touches[0];
  const scaleW=W/canvas.getBoundingClientRect().width, scaleH=H/canvas.getBoundingClientRect().height;
  const dsx=(t0.clientX-lastX)*scaleW, dsy=(t0.clientY-lastY)*scaleH;
  if (draggingView) { rotY+=(t0.clientX-lastX)*0.012; rotX=Math.max(-1.2,Math.min(1.2,rotX+(t0.clientY-lastY)*0.012)); }
  else { const {dx,dy}=screenDeltaToWorld(dsx,dsy); pt.x=Math.max(-2.3,Math.min(2.3,pt.x+dx)); pt.y=Math.max(-2.3,Math.min(2.3,pt.y+dy)); }
  lastX=t0.clientX; lastY=t0.clientY; e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend', () => { draggingView=false; draggingPoint=false; });

// Precompute height range for color mapping
const RANGE = 2.4;
const N = 36;
const step = 2*RANGE/N;
let zMin = Infinity, zMax = -Infinity;
for (let i=0;i<=N;i++) for (let j=0;j<=N;j++) {
  const z = f(-RANGE+i*step, -RANGE+j*step);
  if (z<zMin) zMin=z; if (z>zMax) zMax=z;
}

function zColor(z) {
  // terrain: deep blue → teal → green → yellow → orange → red (peaks)
  const t = (z - zMin) / (zMax - zMin);
  let r,g,b;
  if (t < 0.2) { const s=t/0.2; r=20+s*10; g=60+s*100; b=140+s*60; }
  else if (t < 0.4) { const s=(t-0.2)/0.2; r=30+s*40; g=160+s*60; b=200-s*80; }
  else if (t < 0.6) { const s=(t-0.4)/0.2; r=70+s*120; g=220-s*40; b=120-s*80; }
  else if (t < 0.8) { const s=(t-0.6)/0.2; r=190+s*50; g=180-s*80; b=40-s*20; }
  else { const s=(t-0.8)/0.2; r=240; g=100-s*60; b=20; }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

function draw() {
  ctx.clearRect(0,0,W,H);

  const showGrad = document.getElementById('chkGrad').checked;
  const showTan = document.getElementById('chkTan').checked;
  const showContour = document.getElementById('chkContour').checked;
  const az = f(pt.x, pt.y);
  const {gx, gy} = grad2(pt.x, pt.y);

  // Build faces
  const faces = [];
  for (let i=0;i<N;i++) for (let j=0;j<N;j++) {
    const x0=-RANGE+i*step, y0=-RANGE+j*step, x1=x0+step, y1=y0+step;
    const z00=f(x0,y0), z10=f(x1,y0), z11=f(x1,y1), z01=f(x0,y1);
    const cz=(z00+z10+z11+z01)/4;
    const p00=project(x0,y0,z00), p10=project(x1,y0,z10);
    const p11=project(x1,y1,z11), p01=project(x0,y1,z01);
    const depth=(p00.depth+p10.depth+p11.depth+p01.depth)/4;
    faces.push({p00,p10,p11,p01,depth,col:zColor(cz)});
  }
  faces.sort((a,b)=>b.depth-a.depth);

  for (const face of faces) {
    const {p00,p10,p11,p01,col} = face;
    ctx.beginPath();
    ctx.moveTo(p00.sx,p00.sy); ctx.lineTo(p10.sx,p10.sy);
    ctx.lineTo(p11.sx,p11.sy); ctx.lineTo(p01.sx,p01.sy);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 0.4;
    ctx.stroke();
  }

  // Contour lines on surface
  if (showContour) {
    const nLevels = 10;
    for (let li=0; li<nLevels; li++) {
      const lvl = zMin + (li+0.5)*(zMax-zMin)/nLevels;
      // marching squares: find edges where z crosses lvl
      const segments = [];
      for (let i=0;i<N;i++) for (let j=0;j<N;j++) {
        const x0=-RANGE+i*step, y0=-RANGE+j*step, x1=x0+step, y1=y0+step;
        const corners=[
          {x:x0,y:y0,z:f(x0,y0)},{x:x1,y:y0,z:f(x1,y0)},
          {x:x1,y:y1,z:f(x1,y1)},{x:x0,y:y1,z:f(x0,y1)}
        ];
        const edges=[[0,1],[1,2],[2,3],[3,0]];
        const pts=[];
        for (const [a,b] of edges) {
          const ca=corners[a], cb=corners[b];
          if ((ca.z-lvl)*(cb.z-lvl)<0) {
            const t2=(lvl-ca.z)/(cb.z-ca.z);
            const ix=ca.x+(cb.x-ca.x)*t2, iy=ca.y+(cb.y-ca.y)*t2;
            pts.push({x:ix,y:iy,z:lvl});
          }
        }
        if (pts.length===2) segments.push([pts[0],pts[1]]);
      }
      const alpha = 0.55;
      ctx.strokeStyle = `rgba(59,139,212,${alpha})`;
      ctx.lineWidth = 1.2;
      for (const [a,b] of segments) {
        const pa=project(a.x,a.y,a.z+0.01), pb=project(b.x,b.y,b.z+0.01);
        ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
      }
    }
  }

  // Tangent plane
  if (showTan) {
    const ps = 0.5;
    const corners=[[-ps,-ps],[ps,-ps],[ps,ps],[-ps,ps]].map(([dx,dy])=>
      project(pt.x+dx, pt.y+dy, az + gx*dx + gy*dy));
    ctx.beginPath(); ctx.moveTo(corners[0].sx,corners[0].sy);
    for(let k=1;k<4;k++) ctx.lineTo(corners[k].sx,corners[k].sy);
    ctx.closePath();
    ctx.fillStyle='rgba(120,220,140,0.28)'; ctx.fill();
    ctx.strokeStyle='rgba(60,170,90,0.8)'; ctx.lineWidth=1.2; ctx.stroke();
  }

  // Gradient arrow
  if (showGrad) {
    const gl = Math.sqrt(gx*gx+gy*gy) || 1;
    const gs = 0.55;
    const pp = project(pt.x, pt.y, az);
    const ep = project(pt.x + gx/gl*gs, pt.y + gy/gl*gs, az + gl*gs*0.35);
    ctx.beginPath(); ctx.strokeStyle='#E85D24'; ctx.lineWidth=2.8;
    ctx.moveTo(pp.sx,pp.sy); ctx.lineTo(ep.sx,ep.sy); ctx.stroke();
    const ang = Math.atan2(ep.sy-pp.sy, ep.sx-pp.sx);
    ctx.beginPath(); ctx.fillStyle='#E85D24';
    ctx.moveTo(ep.sx,ep.sy);
    ctx.lineTo(ep.sx-10*Math.cos(ang-0.38), ep.sy-10*Math.sin(ang-0.38));
    ctx.lineTo(ep.sx-10*Math.cos(ang+0.38), ep.sy-10*Math.sin(ang+0.38));
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#E85D24'; ctx.font='bold 13px sans-serif';
    ctx.fillText('∇f', ep.sx+4, ep.sy-5);

    // also show gradient projected onto ground plane (xy)
    const gp0 = project(pt.x, pt.y, zMin-0.05);
    const gp1 = project(pt.x+gx/gl*gs, pt.y+gy/gl*gs, zMin-0.05);
    ctx.beginPath(); ctx.strokeStyle='rgba(232,93,36,0.35)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.moveTo(gp0.sx,gp0.sy); ctx.lineTo(gp1.sx,gp1.sy); ctx.stroke(); ctx.setLineDash([]);
  }

  // Vertical drop line
  const pp = project(pt.x,pt.y,az);
  const bot = project(pt.x,pt.y,zMin-0.05);
  ctx.beginPath(); ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(212,83,126,0.4)'; ctx.lineWidth=1;
  ctx.moveTo(pp.sx,pp.sy); ctx.lineTo(bot.sx,bot.sy); ctx.stroke(); ctx.setLineDash([]);

  // Point
  ctx.beginPath(); ctx.arc(pp.sx,pp.sy,11,0,2*Math.PI);
  ctx.fillStyle='rgba(212,83,126,0.2)'; ctx.fill();
  ctx.beginPath(); ctx.arc(pp.sx,pp.sy,6,0,2*Math.PI);
  ctx.fillStyle='#D4537E'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.8; ctx.stroke();
  ctx.fillStyle='#D4537E'; ctx.font='bold 12px sans-serif';
  ctx.fillText(`(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)})`, pp.sx+10, pp.sy-6);
  ctx.fillStyle='rgba(180,80,110,0.8)'; ctx.font='11px sans-serif';
  ctx.fillText(`z = ${az.toFixed(3)}`, pp.sx+10, pp.sy+8);

  // Axes
  for (const [ex,ey,ez,lbl] of [[2.6,0,0,'x'],[0,2.6,0,'y'],[0,0,1.5,'z']]) {
    const o=project(0,0,0), e=project(ex,ey,ez);
    ctx.beginPath(); ctx.strokeStyle='rgba(140,140,140,0.5)'; ctx.lineWidth=1;
    ctx.moveTo(o.sx,o.sy); ctx.lineTo(e.sx,e.sy); ctx.stroke();
    ctx.fillStyle='rgba(140,140,140,0.85)'; ctx.font='13px sans-serif';
    ctx.fillText(lbl, e.sx+4, e.sy+4);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
